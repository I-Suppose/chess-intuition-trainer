name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - run: npm run build

  backend:
    name: Backend and deployment config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app main.py worker.py build.py migrations
      - run: python -c "from main import app; assert app.title == 'Chess Intuition Trainer API'"
      - name: Validate Vercel and Python project configuration
        working-directory: .
        run: python -c "import json, tomllib; config=json.load(open('vercel.json', encoding='utf-8')); pyproject=tomllib.load(open('backend/pyproject.toml', 'rb')); assert config['services']['backend']['entrypoint']=='pyproject.toml', 'Vercel backend must build the declared Celery subscriber'; assert pyproject['tool']['vercel']['subscribers'], 'Vercel game import and analysis worker subscriber is missing'"
