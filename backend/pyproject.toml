[project]
name = "chess-intuition-trainer-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "celery>=5.4,<6",
  "httpx>=0.27,<1",
  "python-chess>=1.999,<2",
  "supabase>=2.10,<3",
  "pydantic-settings>=2.6,<3",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python build.py"

[[tool.vercel.subscribers]]
entrypoint = "worker:app"
