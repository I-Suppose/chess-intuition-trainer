app = "chess-intuition-trainer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    VITE_API_URL = "/api/v1"
    VITE_SUPABASE_URL = ""
    VITE_SUPABASE_ANON_KEY = ""

[deploy]
  release_command = "alembic upgrade head"

[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker = "celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
